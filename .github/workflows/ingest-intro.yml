name: Ingest intro media

on:
  push:
    branches: [app-intro-screen]
    paths:
      - '.github/workflows/ingest-intro.yml'

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: app-intro-screen

      - name: Download source clip
        env:
          SOURCE_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/6fa8bc85-ec6c-4858-8b7a-74dcedb0c31d.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZTU1ZGVkMjcwYmI5MzY1ZiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTI3NDAyM30.DrAMcXIcYrgBYqfiW9a1fkM_E8GtmrgBSvLqExctO_U"
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$SOURCE_URL" -o /tmp/intro-source.mp4

      - name: Optimize for web
        run: |
          set -euo pipefail
          mkdir -p public/intro
          ffmpeg -y -i /tmp/intro-source.mp4 -an \
            -vf "fps=30,scale=720:1280:flags=lanczos" \
            -c:v libx264 -preset medium -crf 30 -profile:v high -level 4.0 \
            -pix_fmt yuv420p -movflags +faststart \
            public/intro/skillsconnect-intro.mp4
          ffmpeg -y -ss 2.25 -i public/intro/skillsconnect-intro.mp4 \
            -frames:v 1 -q:v 3 public/intro/skillsconnect-intro-poster.jpg

      - name: Commit optimized assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/intro/skillsconnect-intro.mp4 public/intro/skillsconnect-intro-poster.jpg
          git commit -m "Add optimized app intro media"
          git push origin HEAD:app-intro-screen
