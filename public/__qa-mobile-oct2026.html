<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Responsive deployment verification</title><style>*{box-sizing:border-box}body{margin:0;background:#181818;color:#fff;font:14px Arial}header{display:flex;align-items:center;gap:16px;padding:14px 24px}label{display:flex;gap:10px;align-items:center}select,button{padding:8px;background:#333;color:#fff;border:1px solid #777;border-radius:6px}main{display:flex;justify-content:center;padding:12px}iframe{display:block;height:820px;border:0;background:#080808;max-width:100%}pre{margin:0;padding:12px 24px;font-size:11px;white-space:pre-wrap}</style></head><body><header><label>Viewport<select id="width" aria-label="Viewport width"><option value="360">360px phone</option><option value="390" selected>390px phone</option><option value="430">430px phone</option><option value="768">768px tablet</option><option value="1024">1024px tablet</option></select></label><button id="home">Return frame home</button><button id="check">Inspect layout</button></header><main><iframe id="app" title="Responsive application" width="390" src="/"></iframe></main><pre id="report">Loading...</pre><script>
const app=document.getElementById('app'),width=document.getElementById('width');
width.onchange=()=>{app.width=width.value;document.getElementById('report').textContent='Viewport set to '+width.value;};
document.getElementById('home').onclick=()=>{app.src='/';};
function inspect(){try{const w=app.contentWindow,d=w.document;const hit=Array.from(d.querySelectorAll('a,button,summary')).filter(e=>{const r=e.getBoundingClientRect(),s=w.getComputedStyle(e);return r.width>0&&r.height>0&&s.visibility!=='hidden'&&s.display!=='none'});const out=Array.from(d.querySelectorAll('main *')).filter(e=>{const r=e.getBoundingClientRect();return r.width>0&&(r.right>d.documentElement.clientWidth+1||r.left<-1)&&w.getComputedStyle(e).position!=='fixed'&&!e.className?.toString().includes('skip')}).slice(0,15).map(e=>({tag:e.tagName,text:e.textContent.slice(0,50),class:e.className}));document.getElementById('report').textContent=JSON.stringify({url:w.location.pathname,viewport:d.documentElement.clientWidth,scrollWidth:d.documentElement.scrollWidth,h1:d.querySelector('h1')?.textContent,theme:d.documentElement.dataset.scpTheme,heroHeight:d.querySelector('[aria-labelledby="home-heading"]')?.getBoundingClientRect().height,request:hit.find(e=>e.textContent.includes('Describe your job'))?.getBoundingClientRect().toJSON(),brokenImages:Array.from(d.images).filter(i=>i.complete&&!i.naturalWidth).map(i=>i.src),overflow:out},null,2);}catch(e){document.getElementById('report').textContent=e.message}}
app.onload=inspect;document.getElementById('check').onclick=inspect;
</script></body></html>
